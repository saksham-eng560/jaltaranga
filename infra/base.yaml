AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Jaltaranga (jt-<env>) - shared resources (SHARED_RESOURCES §4) plus each owner's append-only section.
  GENERATED by infra/build_template.py from infra/base.yaml + infra/sections/*.yaml; edit those, not this file.

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, demo]
    Default: dev
  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: Set from `make -C alerts probe` (SHARED §11.6)
  BedrockModelId:
    Type: String
    Default: us.amazon.nova-micro-v1:0
    Description: Inference profile id from the probe (e.g. global.amazon.nova-2-lite-v1:0)
  CorsOrigin:
    Type: String
    Default: "*"
    Description: Amplify origin of jt-<env>-web once known
  DispatchEmail:
    Type: String
    Default: ""
    Description: Team inbox subscribed to the dispatch topic (confirm the subscription email after deploy)
  BudgetEmail:
    Type: String
    Default: ""
    Description: Recipient of the USD 10 budget alarm

Conditions:
  HasDispatchEmail: !Not [!Equals [!Ref DispatchEmail, ""]]
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, ""]]

Globals:
  Function:
    Tags: {project: jaltaranga, env: !Ref Env}

Resources:
# --- shared (Shivansh) ------------------------------------------------------------------------
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub jt-${Env}-data-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, HEAD]
            AllowedOrigins: [!Ref CorsOrigin]
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag, Content-Range]
          - AllowedMethods: [POST]
            AllowedOrigins: [!Ref CorsOrigin]
            AllowedHeaders: ["*"]
      Tags:
        - {Key: project, Value: jaltaranga}
        - {Key: owner, Value: shivansh}
        - {Key: env, Value: !Ref Env}

  ColoniesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub jt-${Env}-colonies
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: colony_id, AttributeType: S}]
      KeySchema: [{AttributeName: colony_id, KeyType: HASH}]
      Tags: [{Key: project, Value: jaltaranga}, {Key: owner, Value: shivansh}, {Key: env, Value: !Ref Env}]

  SheltersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub jt-${Env}-shelters
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: shelter_id, AttributeType: S}]
      KeySchema: [{AttributeName: shelter_id, KeyType: HASH}]
      Tags: [{Key: project, Value: jaltaranga}, {Key: owner, Value: shivansh}, {Key: env, Value: !Ref Env}]

  DispatchesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub jt-${Env}-dispatches
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: dispatch_id, AttributeType: S}]
      KeySchema: [{AttributeName: dispatch_id, KeyType: HASH}]
      Tags: [{Key: project, Value: jaltaranga}, {Key: owner, Value: saksham}, {Key: env, Value: !Ref Env}]

  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub jt-${Env}-reports
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: report_id, AttributeType: S}]
      KeySchema: [{AttributeName: report_id, KeyType: HASH}]
      Tags: [{Key: project, Value: jaltaranga}, {Key: owner, Value: saksham}, {Key: env, Value: !Ref Env}]

  ScenarioStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub jt-${Env}-scenario-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      Tags: [{Key: project, Value: jaltaranga}, {Key: owner, Value: saksham}, {Key: env, Value: !Ref Env}]

  DispatchTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub jt-${Env}-dispatch
      Tags: [{Key: project, Value: jaltaranga}, {Key: owner, Value: saksham}, {Key: env, Value: !Ref Env}]

  DispatchEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasDispatchEmail
    Properties:
      TopicArn: !Ref DispatchTopic
      Protocol: email
      Endpoint: !Ref DispatchEmail

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub jt-${Env}-api
      CorsConfiguration:
        AllowOrigins: [!Ref CorsOrigin]
        AllowMethods: [GET, POST, PATCH, OPTIONS]
        AllowHeaders: [content-type, authorization]
      Tags: {project: jaltaranga, owner: shivansh, env: !Ref Env}

  JtSharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub jt-${Env}-jt-shared
      ContentUri: ../shared/py/
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [arm64]
    Metadata:
      BuildMethod: python3.12
      BuildArchitecture: arm64

  BudgetAlarm:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !Sub jt-${Env}-budget
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 10, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
# --- end shared --------------------------------------------------------------------------------
