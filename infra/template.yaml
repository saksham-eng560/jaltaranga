AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Jaltaranga (jt-<env>) - shared resources (SHARED_RESOURCES §4) plus each owner's append-only section.
  GENERATED by infra/build_template.py from infra/base.yaml + infra/sections/*.yaml; edit those, not this file.

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, demo]
    Default: dev
  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: Set from `make -C alerts probe` (SHARED §11.6)
  BedrockModelId:
    Type: String
    Default: us.amazon.nova-micro-v1:0
    Description: Inference profile id from the probe (e.g. global.amazon.nova-2-lite-v1:0)
  CorsOrigin:
    Type: String
    Default: "*"
    Description: Amplify origin of jt-<env>-web once known
  DispatchEmail:
    Type: String
    Default: ""
    Description: Team inbox subscribed to the dispatch topic (confirm the subscription email after deploy)
  BudgetEmail:
    Type: String
    Default: ""
    Description: Recipient of the USD 10 budget alarm

Conditions:
  HasDispatchEmail: !Not [!Equals [!Ref DispatchEmail, ""]]
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, ""]]

Globals:
  Function:
    Tags: {project: jaltaranga, env: !Ref Env}
  HttpApi:
    Auth:
      EnableIamAuthorizer: true

Resources:
# --- shared (Shivansh) ------------------------------------------------------------------------
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub jt-${Env}-data-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, HEAD]
            AllowedOrigins: [!Ref CorsOrigin]
            AllowedHeaders: ["*"]
            ExposedHeaders: [ETag, Content-Range]
          - AllowedMethods: [POST]
            AllowedOrigins: [!Ref CorsOrigin]
            AllowedHeaders: ["*"]
      Tags:
        - {Key: project, Value: jaltaranga}
        - {Key: owner, Value: shivansh}
        - {Key: env, Value: !Ref Env}

  ColoniesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub jt-${Env}-colonies
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: colony_id, AttributeType: S}]
      KeySchema: [{AttributeName: colony_id, KeyType: HASH}]
      Tags: [{Key: project, Value: jaltaranga}, {Key: owner, Value: shivansh}, {Key: env, Value: !Ref Env}]

  SheltersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub jt-${Env}-shelters
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: shelter_id, AttributeType: S}]
      KeySchema: [{AttributeName: shelter_id, KeyType: HASH}]
      Tags: [{Key: project, Value: jaltaranga}, {Key: owner, Value: shivansh}, {Key: env, Value: !Ref Env}]

  DispatchesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub jt-${Env}-dispatches
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: dispatch_id, AttributeType: S}]
      KeySchema: [{AttributeName: dispatch_id, KeyType: HASH}]
      Tags: [{Key: project, Value: jaltaranga}, {Key: owner, Value: saksham}, {Key: env, Value: !Ref Env}]

  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub jt-${Env}-reports
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: report_id, AttributeType: S}]
      KeySchema: [{AttributeName: report_id, KeyType: HASH}]
      Tags: [{Key: project, Value: jaltaranga}, {Key: owner, Value: saksham}, {Key: env, Value: !Ref Env}]

  ScenarioStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub jt-${Env}-scenario-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}]
      Tags: [{Key: project, Value: jaltaranga}, {Key: owner, Value: saksham}, {Key: env, Value: !Ref Env}]

  DispatchTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub jt-${Env}-dispatch
      Tags: [{Key: project, Value: jaltaranga}, {Key: owner, Value: saksham}, {Key: env, Value: !Ref Env}]

  DispatchEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasDispatchEmail
    Properties:
      TopicArn: !Ref DispatchTopic
      Protocol: email
      Endpoint: !Ref DispatchEmail

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub jt-${Env}-api
      CorsConfiguration:
        AllowOrigins: [!Ref CorsOrigin]
        AllowMethods: [GET, POST, PATCH, OPTIONS]
        AllowHeaders: [content-type, authorization]
      Tags: {project: jaltaranga, owner: shivansh, env: !Ref Env}

  JtSharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub jt-${Env}-jt-shared
      ContentUri: ../shared/py/
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [arm64]
    Metadata:
      BuildMethod: python3.12
      BuildArchitecture: arm64

  BudgetAlarm:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !Sub jt-${Env}-budget
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 10, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
# --- end shared --------------------------------------------------------------------------------

# --- ML API (Vaibhav) -------------------------------------------------------------------------
# Read-only API for precomputed forecast and inundation artifacts stored in DataBucket.
# The artifact publisher writes ml/out/ under the bucket root, preserving its relative paths.

  ForecastFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub jt-${Env}-forecast-fn
      CodeUri: ../ml/lambda/forecast_fn/
      Handler: handler.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 10
      LoggingConfig: {LogFormat: JSON}
      Environment:
        Variables:
          JT_ENV: !Ref Env
          JT_DATA_BUCKET: !Ref DataBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub arn:${AWS::Partition}:s3:::${DataBucket}/models/registry.json
                - !Sub arn:${AWS::Partition}:s3:::${DataBucket}/models/inundation/v1/whatif/*
                - !Sub arn:${AWS::Partition}:s3:::${DataBucket}/models/inundation/v1/ladder/*
                - !Sub arn:${AWS::Partition}:s3:::${DataBucket}/scenarios/yamuna-2023-07/forecasts/*
                - !Sub arn:${AWS::Partition}:s3:::${DataBucket}/scenarios/yamuna-2023-07/depth/*
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub arn:${AWS::Partition}:s3:::${DataBucket}
              Condition:
                StringLike:
                  s3:prefix: ["scenarios/yamuna-2023-07/forecasts/*"]
      Events:
        ModelCard:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: "/models/card"
        Forecast:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: "/scenarios/{id}/forecast"
        Flood:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: "/scenarios/{id}/flood"
        WhatIf:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: "/scenarios/{id}/whatif"
      Tags: {project: jaltaranga, owner: vaibhav, env: !Ref Env}

  ForecastLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/jt-${Env}-forecast-fn
      RetentionInDays: 7

# --- end ML API -------------------------------------------------------------------------------

# --- routing/alerts (Saksham) -----------------------------------------------------------------
# Append-only section for infra/template.yaml (SHARED §4, INTEGRATION_PLAN §1 rules).
# Shivansh owns the template and merges this block under `Resources:`.
#
# Expects these from the shared template (rename here if the logical IDs differ):
#   Parameters: Env (dev|demo), BedrockRegion, BedrockModelId, CorsOrigin
#   Resources:  DataBucket (S3), HttpApi (AWS::Serverless::HttpApi), DispatchTopic (SNS),
#               SheltersTable, DispatchesTable, ReportsTable, ScenarioStateTable (DynamoDB),
#               JtSharedLayer (jt_shared + pydantic, python3.12 arm64)
# Powertools is not required: handlers use jt_shared.http and EMF metrics directly.

  RoutingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub jt-${Env}-routing-fn
      CodeUri: ../routing/
      Handler: handlers.api.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 10
      Layers: [!Ref JtSharedLayer]
      LoggingConfig: {LogFormat: JSON}
      Environment:
        Variables:
          JT_ENV: !Ref Env
          JT_DATA_BUCKET: !Ref DataBucket
          JT_SHELTERS_TABLE: !Ref SheltersTable
          JT_REPORTS_TABLE: !Ref ReportsTable
          JT_CORS_ORIGIN: !Ref CorsOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub arn:aws:s3:::${DataBucket}/scenarios/*
                - !Sub arn:aws:s3:::${DataBucket}/static/*
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub arn:aws:s3:::${DataBucket}/uploads/reports/*
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Scan, dynamodb:UpdateItem]
              Resource: !GetAtt SheltersTable.Arn
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt ReportsTable.Arn
      Events:
        Roads:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: "/scenarios/{id}/roads"
        Plans:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: "/scenarios/{id}/plans"
        Unreachable:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: "/scenarios/{id}/unreachable"
        Shelters:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: "/shelters"
        ShelterPatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Auth:
              Authorizer: AWS_IAM
            Method: PATCH
            Path: "/shelters/{id}"
        Reports:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Auth:
              Authorizer: AWS_IAM
            Method: POST
            Path: "/reports"
      Tags: {project: jaltaranga, owner: saksham, env: !Ref Env}

  RoutingLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/jt-${Env}-routing-fn
      RetentionInDays: 7

  AlertsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub jt-${Env}-alerts-fn
      CodeUri: ../alerts/
      Handler: handlers.api.handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 25            # under the 30 s HTTP API limit; the draft itself has an 18 s budget
      Layers: [!Ref JtSharedLayer]
      LoggingConfig: {LogFormat: JSON}
      Environment:
        Variables:
          JT_ENV: !Ref Env
          JT_DATA_BUCKET: !Ref DataBucket
          JT_BEDROCK_REGION: !Ref BedrockRegion
          JT_BEDROCK_MODEL_ID: !Ref BedrockModelId
          JT_BEDROCK_DISABLED: "0"      # kill switch → template-only
          JT_SNS_TOPIC_ARN: !Ref DispatchTopic
          JT_POLLY_VOICE: Kajal
          JT_POLLY_REGION: ap-south-1
          JT_DISPATCHES_TABLE: !Ref DispatchesTable
          JT_STATE_TABLE: !Ref ScenarioStateTable
          JT_DRAFT_DEADLINE_S: "18"
          JT_CORS_ORIGIN: !Ref CorsOrigin
      Policies:
        - Statement:
            # Bedrock through a (global or geo) inference profile: SHARED §11.8-11, documented 3-statement form.
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:aws:bedrock:${BedrockRegion}:${AWS::AccountId}:inference-profile/${BedrockModelId}
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: arn:aws:bedrock:*::foundation-model/amazon.nova-*
              Condition:
                StringLike:
                  bedrock:InferenceProfileArn: !Sub arn:aws:bedrock:${BedrockRegion}:${AWS::AccountId}:inference-profile/${BedrockModelId}
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: arn:aws:bedrock:::foundation-model/amazon.nova-*
              Condition:
                StringEquals: {aws:RequestedRegion: unspecified}
                StringLike:
                  bedrock:InferenceProfileArn: !Sub arn:aws:bedrock:${BedrockRegion}:${AWS::AccountId}:inference-profile/${BedrockModelId}
            - Effect: Allow
              Action: polly:SynthesizeSpeech
              Resource: "*"
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub arn:aws:s3:::${DataBucket}/scenarios/*
                - !Sub arn:aws:s3:::${DataBucket}/static/*
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub arn:aws:s3:::${DataBucket}/audio/*
            - Effect: Allow
              Action: s3:ListBucket       # so a missing audio key is a 404 (not 403) on head_object
              Resource: !Sub arn:aws:s3:::${DataBucket}
              Condition: {StringLike: {s3:prefix: ["audio/*"]}}
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref DispatchTopic
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Scan]
              Resource: [!GetAtt DispatchesTable.Arn, !GetAtt ScenarioStateTable.Arn]
      Events:
        Draft:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Auth:
              Authorizer: AWS_IAM
            Method: POST
            Path: "/scenarios/{id}/colonies/{cid}/dispatch"
        Approve:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Auth:
              Authorizer: AWS_IAM
            Method: POST
            Path: "/dispatches/{dispatch_id}/approve"
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Auth:
              Authorizer: AWS_IAM
            Method: GET
            Path: "/dispatches"
        Ack:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Auth:
              Authorizer: AWS_IAM
            Method: POST
            Path: "/dispatches/{dispatch_id}/ack"
      Tags: {project: jaltaranga, owner: saksham, env: !Ref Env}

  AlertsLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/jt-${Env}-alerts-fn
      RetentionInDays: 7

# Outputs (added by build_template.py):
#   RoutingFunctionName: !Ref RoutingFunction
#   AlertsFunctionName:  !Ref AlertsFunction
# --- end routing/alerts (Saksham) -------------------------------------------------------------

Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  DataBucketName:
    Value: !Ref DataBucket
  DispatchTopicArn:
    Value: !Ref DispatchTopic
  RoutingFunctionName:
    Value: !Ref RoutingFunction
  AlertsFunctionName:
    Value: !Ref AlertsFunction
  ForecastFunctionName:
    Value: !Ref ForecastFunction
