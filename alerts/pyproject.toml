[project]
name = "jt_alerts"
version = "1.0.0"
description = "Jaltaranga alerts: slot-filled Bedrock dispatch, validator, Polly Kajal, SNS, dispatch log"
requires-python = ">=3.12"
dependencies = ["jt_shared"]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jt_alerts"]

[tool.setuptools.package-data]
jt_alerts = ["prompts/*.md"]
