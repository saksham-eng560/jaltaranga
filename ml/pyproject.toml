[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jt-ml"
version = "0.1.0"
description = "Jaltaranga ML/AI Core: Hydrological forecasting and inundation modeling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.3.0",
    "scikit-image>=0.22.0",
    "shapely>=2.0.0",
    "rasterio>=1.3.0",
    "pydantic>=2.4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.1.0",
    "mapie>=0.8.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jt_ml*"]
