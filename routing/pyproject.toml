[project]
name = "jt_routing"
version = "1.0.0"
description = "Jaltaranga routing: road cutoffs, time-dependent evacuation routing, capacity-aware shelter assignment"
requires-python = ">=3.12"
# Lambda (handlers/, jt_routing/serving.py) needs only jt_shared (+ pydantic via the shared layer).
dependencies = ["jt_shared"]

[project.optional-dependencies]
# Offline precompute only (SHARED §11.8-13: pin what resolves; networkx>=3.4,<4 per review).
offline = ["networkx>=3.4,<4", "numpy>=2.0,<3", "rasterio>=1.4,<2", "ortools==9.15.6755"]
aws = ["boto3>=1.34"]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jt_routing"]
